name: CI Quality & Syntax Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Validate Bash Script Syntax (bash -n)
        run: |
          bash -n bin/baliza
          bash -n install.sh
          bash -n uninstall.sh
          echo "All shell scripts passed syntax validation."

      - name: Run ShellCheck Linting
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './bin'
          additional_files: 'install.sh uninstall.sh'
        continue-on-error: true

      - name: Verify Config Files & Service Units
        run: |
          test -f config/8188eu.conf
          test -f config/blacklist-rtl8xxxu.conf
          test -f config/99-ip-forward.conf
          test -f config/baliza.service
          test -f patches/README.md
          test -f docs/TECHNICAL_REPORT.md
          echo "Configuration files and technical reports verified."
